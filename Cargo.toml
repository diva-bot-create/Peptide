[workspace]
members = ["crates/ssf2-converter"]
resolver = "2"

[package]
name = "peptide"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "peptide"
path = "src/main.rs"

[dependencies]
# ── Engine harness (bytecode patcher + webview UI + CDP FrayTools driver) ──
hlbc = "=0.7.0"
anyhow = "1.0"
ratatui = "0.30.0"
crossterm = "0.29.0"
wry = { version = "0.55.1", features = ["transparent"] }
tao = "0.35.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = "0.21"
image = "0.25.10"  # PNG decode/encode for recoloring the ripped stock icon (palette swap)
libc = "0.2"       # parent-pid liveness check so the overlay self-exits when its session dies
# ── Config persistence + native file dialogs (ported from the old egui GUI) ──
dirs = "5"
rfd = "0.15"
# ── In-process SSF2 → Fraymakers conversion (folded in; no more sidecar bin) ──
ssf2_converter = { path = "crates/ssf2-converter" }
log = "0.4"
env_logger = "0.11"

# ── macOS overlay: force true NSWindow transparency + find/follow the game window ──
# (a target table; MUST come after the plain [dependencies] keys above, or it would
# absorb every dep declared below it into the macOS-only set.)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSColor", "NSResponder", "NSView"] }
core-graphics = "0.25"
core-foundation = "0.10"

# ── Windows: re-attach a GUI-subsystem .exe to its launching console for CLI ──
# subcommands (platform::attach_parent_console). Release builds hide the console
# window on launch via windows_subsystem = "windows" (see src/main.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",          # SECURITY_ATTRIBUTES — required for the CreateFileW binding
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }


[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.0"

# Conversion-hot crates are built OPTIMIZED even in dev/test; everything else (including the
# whole GUI/webview tree) stays at opt-level 0. A conversion is almost entirely inflate, image
# decode/encode and the SWF tag walk, so unoptimized these ran ~10x slower than release — one
# sandbag conversion took ~90s under `cargo test` vs 8s from the release binary, and the suite
# converts a character several times over. Optimizing JUST these takes it to ~9s.
#
# Deliberately NOT `package."*"`: this workspace has 285 crates and blanket-optimizing them
# means a very long one-time rebuild of dependencies that have nothing to do with conversion
# speed. Keep this list to the hot path.
[profile.dev.package.ssf2_converter]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.zune-inflate]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.swf]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 2
[profile.dev.package.adler2]
opt-level = 2
# The rest of the hot path, and the reason a codec-only list wasn't enough: the converter runs
# thousands of regex rewrites over the extracted scripts, hashes a deterministic uuid per symbol
# and keyframe, and serialises every .entity as JSON. Unoptimized those three dominate.
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.aho-corasick]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2
[profile.dev.package.sha1]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.digest]
opt-level = 2
